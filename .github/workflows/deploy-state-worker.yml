name: Deploy gathering site and shared-state Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-shared-state-worker
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify domain routing and existing service compatibility
        run: node --test --test-isolation=none test/domain-migration.test.js test/state-worker.test.js test/wedding-media.test.js test/dropbox.test.js test/qr-access.test.js test/general-login-qr.test.js
      - name: Build gathering site from the shared frontend source
        run: node scripts/build-domain-site.js .domain-site
      - uses: actions/upload-artifact@v4
        with:
          name: gathering-domain-site
          path: .domain-site/
          include-hidden-files: true
          retention-days: 1

  deploy_state_worker:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy existing service in its original Cloudflare account
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.151.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: github-state-worker
          command: deploy

  deploy_domain_site:
    needs: [validate, deploy_state_worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check credentials for the account containing ilymmd.com
        env:
          CLOUDFLARE_DOMAIN_API_TOKEN: ${{ secrets.CLOUDFLARE_DOMAIN_API_TOKEN }}
          CLOUDFLARE_DOMAIN_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DOMAIN_ACCOUNT_ID }}
        run: |
          for secret_name in CLOUDFLARE_DOMAIN_API_TOKEN CLOUDFLARE_DOMAIN_ACCOUNT_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Add repository secret ${secret_name} from the Cloudflare account containing ilymmd.com. Keep the existing service-account secrets unchanged."
              exit 1
            fi
          done
      - uses: actions/download-artifact@v4
        with:
          name: gathering-domain-site
          path: .domain-site
      - name: Deploy website routes in the ilymmd.com Cloudflare account
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.151.1"
          apiToken: ${{ secrets.CLOUDFLARE_DOMAIN_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_DOMAIN_ACCOUNT_ID }}
          workingDirectory: domain-site-worker
          command: deploy
      - name: Verify both public websites and legacy invitation address
        run: node scripts/verify-live-domain.js
