name: Deploy gathering site and shared-state Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-shared-state-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy gatherings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require owner-approved state security rollout
        env:
          SECURITY_ROLLOUT_APPROVED: ${{ vars.SECURITY_ROLLOUT_APPROVED }}
        run: |
          if [ "$SECURITY_ROLLOUT_APPROVED" != "state-auth-v1" ]; then
            echo "::error::Deployment is blocked. Verify the private backup/restore drill, configure the approved server secrets, obtain owner approval, then set repository variable SECURITY_ROLLOUT_APPROVED=state-auth-v1."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify domain routing and existing service compatibility
        run: node --test --test-isolation=none test/domain-migration.test.js test/site-icon.test.js test/state-worker.test.js test/wedding-media.test.js test/dropbox.test.js test/qr-access.test.js test/general-login-qr.test.js test/state-security.test.js test/state-client.test.js test/private-state-backup.test.js test/shared-sync.test.js test/static-privacy.test.js
      - name: Build gathering site from the shared frontend source
        run: node scripts/build-domain-site.js .domain-site
      - name: Deploy existing service in its original Cloudflare account
        timeout-minutes: 5
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.151.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: github-state-worker
          command: deploy

      - name: Check credentials for the account containing ilymmd.com
        env:
          CLOUDFLARE_DOMAIN_API_TOKEN: ${{ secrets.CLOUDFLARE_DOMAIN_API_TOKEN }}
          CLOUDFLARE_DOMAIN_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DOMAIN_ACCOUNT_ID }}
        run: |
          for secret_name in CLOUDFLARE_DOMAIN_API_TOKEN CLOUDFLARE_DOMAIN_ACCOUNT_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Add repository secret ${secret_name} from the Cloudflare account containing ilymmd.com. Keep the existing service-account secrets unchanged."
              exit 1
            fi
          done
      - name: Deploy website routes in the ilymmd.com Cloudflare account
        timeout-minutes: 5
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.151.1"
          apiToken: ${{ secrets.CLOUDFLARE_DOMAIN_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_DOMAIN_ACCOUNT_ID }}
          workingDirectory: domain-site-worker
          command: deploy
      - name: Verify both public websites and legacy invitation address
        timeout-minutes: 5
        run: node scripts/verify-live-domain.js
