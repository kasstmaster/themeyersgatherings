name: Validate shared gathering builder

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-gathering-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test shared builder and gathering isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run shared builder and feature regression tests
        run: npm test
      - name: Build the shared gathering frontend
        run: node scripts/build-domain-site.js .domain-site
