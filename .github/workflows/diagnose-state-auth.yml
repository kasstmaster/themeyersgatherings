name: Diagnose secure service (read only)
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Optional active release commit; defaults to selected ref
        type: string
        required: false
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect harmless readiness and service metadata only
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/diagnose-state-auth.js
