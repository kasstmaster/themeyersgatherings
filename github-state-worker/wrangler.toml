name = "curly-sun-ef0f"
main = "worker.js"
compatibility_date = "2026-09-17"
workers_dev = true

[vars]
# Live shared state is kept separately because it contains guest names.
GITHUB_REPOSITORY = "kasstmaster/themeyersevents-data"
GITHUB_BRANCH = "main"
GITHUB_STATE_PATH = "data/app-state.json"
# Keep printed invitation links working at the existing origin.
ALLOWED_ORIGIN = "https://kasstmaster.github.io"
ALLOWED_ORIGINS = "https://ilymmd.com,https://www.ilymmd.com,https://themeyers.ilymmd.com,https://meyer.ilymmd.com"
# Repository containing this website and sync-anylist.yml.
GITHUB_WORKFLOW_REPOSITORY = "kasstmaster/thanksgiving"
GITHUB_WORKFLOW_BRANCH = "main"

# Create this once with `npx wrangler r2 bucket create meyers-invitation-backgrounds`.
# Uploaded invitation artwork lives here as runtime data, never in the website repository.
[[r2_buckets]]
binding = "INVITATION_BACKGROUNDS"
bucket_name = "meyers-invitation-backgrounds"

# Capture completed gatherings even when nobody opens the website.
[triggers]
crons = ["5 * * * *"]
