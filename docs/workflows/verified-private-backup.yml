# Generated by scripts/build-private-backup-workflow.js in themeyersgatherings.
# Install ONLY in kasstmaster/themeyersevents-data/.github/workflows/verified-private-backup.yml.
name: Verify private state backup
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Creates new private backup and receipt files only; never restores live data
        type: choice
        options:
          - Do not run
          - Create private backup only
        default: Do not run
        required: true
      writers_coordinated:
        description: I have coordinated writers and preserved unsynced drafts for this backup
        type: boolean
        default: false
        required: true
permissions:
  contents: write
concurrency:
  group: verified-private-state-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'kasstmaster/themeyersevents-data' && github.ref == 'refs/heads/main' && inputs.confirmation == 'Create private backup only' && inputs.writers_coordinated == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create private backup and verify recovery without restoring live state
        env:
          STATE_REPOSITORY_TOKEN: ${{ github.token }}
          BACKUP_CONFIRM: ${{ inputs.confirmation }}
          WRITERS_COORDINATED: ${{ inputs.writers_coordinated }}
        shell: bash
        run: |
          node --input-type=module <<'PRIVATE_BACKUP_SCRIPT'
          // Explicit operator tool. Never outputs state, tokens, credentials or guest details.
          import {createHash} from 'node:crypto';
          const hash=value=>createHash('sha256').update(value).digest('hex');
          export async function backupState({repository,branch='main',statePath='data/app-state.json',token,fetchImpl=fetch,now=new Date()}){
           if(!/^[\w.-]+\/[\w.-]+$/.test(repository||'')||!token)throw new Error('Configure the private state repository and token.');
           const api='https://api.github.com/repos/'+repository,headers={Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'User-Agent':'meyers-private-backup','X-GitHub-Api-Version':'2022-11-28'};
           async function call(path,options={}){const response=await fetchImpl(api+path,{...options,headers:{...headers,...options.headers},redirect:'error',signal:AbortSignal.timeout(20000)});if(!response.ok)throw new Error('Backup operation failed (HTTP '+response.status+').');return response.json();}
           const repo=await call('');if(repo.private!==true)throw new Error('Refusing to store a state backup in a public repository.');
           const path=statePath.split('/').map(encodeURIComponent).join('/'),source=await call('/contents/'+path+'?ref='+encodeURIComponent(branch));
           const bytes=Buffer.from(source.content.replace(/\s/g,''),'base64'),text=bytes.toString('utf8');
           const state=JSON.parse(text);if(!state.events||typeof state.events!=='object'||Array.isArray(state.events)||!Array.isArray(state.accounts))throw new Error('Source state has an unexpected format; no backup created.');
           const digest=hash(bytes),destination='security-backups/'+now.toISOString().replace(/[:.]/g,'-')+'-'+digest.slice(0,12)+'/app-state.json';
           const created=await call('/contents/'+destination,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Create private verified pre-security backup',branch,content:bytes.toString('base64')})});
           const verification=await call('/contents/'+destination+'?ref='+encodeURIComponent(created.commit.sha));
           if(hash(Buffer.from(verification.content.replace(/\s/g,''),'base64'))!==digest)throw new Error('Backup verification failed; do not deploy.');
           // Re-read the canonical file to detect a moving target during backup.
           const current=await call('/contents/'+path+'?ref='+encodeURIComponent(branch));
           if((await call('')).private!==true)throw new Error('Repository privacy changed; backup is not verified.');
           if(current.sha!==source.sha)throw new Error('Live state changed during backup. Keep this copy, pause writers, and repeat before deploying.');
           return {repository,branch,path:destination,backupCommit:created.commit.sha,sourceBlob:source.sha,sha256:digest,verified:true};
          }
          export async function verifyRestore({repository,backupCommit,backupPath,expectedHash,token,fetchImpl=fetch}){
           const headers={Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'User-Agent':'meyers-private-restore-check'};
           const base='https://api.github.com/repos/'+repository;
           const repo=await fetchImpl(base,{headers,redirect:'error',signal:AbortSignal.timeout(20000)});if(!repo.ok||(await repo.json()).private!==true)throw new Error('Private repository verification failed.');
           const response=await fetchImpl(base+'/contents/'+backupPath+'?ref='+encodeURIComponent(backupCommit),{headers,redirect:'error',signal:AbortSignal.timeout(20000)});if(!response.ok)throw new Error('Could not read the immutable backup.');
           const record=await response.json(),bytes=Buffer.from(record.content.replace(/\s/g,''),'base64');
           if(hash(bytes)!==expectedHash)throw new Error('Backup hash does not match.');
           const restored=JSON.parse(bytes.toString('utf8'));if(!restored.events||typeof restored.events!=='object'||Array.isArray(restored.events)||!Array.isArray(restored.accounts))throw new Error('Invalid restore data.');
           // Deliberately no live write: restore needs a separately approved expected-SHA write.
           return {verified:true,sha256:expectedHash,restoreDryRun:true};
          }


          // Runs only inside the private repository, using its short-lived GITHUB_TOKEN.
          // Never writes the canonical state file, local backup files or Actions artifacts.
          export async function cloudPrivateBackup(env,fetchImpl=fetch) {
            const repository='kasstmaster/themeyersevents-data',branch='main',statePath='data/app-state.json';
            if(env.GITHUB_REPOSITORY!==repository || env.GITHUB_REF!=='refs/heads/main' ||
              env.GITHUB_EVENT_NAME!=='workflow_dispatch' || !env.STATE_REPOSITORY_TOKEN ||
              env.BACKUP_CONFIRM!=='Create private backup only' || env.WRITERS_COORDINATED!=='true')throw new Error('Backup execution prerequisites not satisfied.');
            const token=env.STATE_REPOSITORY_TOKEN;
            const receipt=await backupState({repository,branch,statePath,token,fetchImpl});
            await verifyRestore({repository,backupCommit:receipt.backupCommit,backupPath:receipt.path,expectedHash:receipt.sha256,token,fetchImpl});
            const base='https://api.github.com/repos/'+repository;
            const headers={Authorization:'Bearer '+token,Accept:'application/vnd.github+json','User-Agent':'meyers-private-backup','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'};
            const call=async(path,options={})=>{
              const response=await fetchImpl(base+path,{...options,headers,redirect:'error',signal:AbortSignal.timeout(20000)});
              if(!response.ok)throw new Error('Private backup receipt verification failed.');
              return response.json();
            };
            const check=async()=>{
              if((await call('')).private!==true)throw new Error('Private repository required.');
              const current=await call('/contents/'+statePath+'?ref=main');
              if(current.sha!==receipt.sourceBlob)throw new Error('Live state changed; repeat after coordinating writers.');
            };
            await check();
            const record={...receipt,statePath,restoreDryRun:true,verifiedAt:new Date().toISOString(),runId:env.GITHUB_RUN_ID||null};
            const receiptPath=receipt.path.replace(/app-state\.json$/,'receipt.json');
            const serialized=JSON.stringify(record,null,2)+'\n';
            const saved=await call('/contents/'+receiptPath,{method:'PUT',body:JSON.stringify({message:'Record private backup integrity and no-write restore verification',branch,content:Buffer.from(serialized).toString('base64')})});
            const checked=await call('/contents/'+receiptPath+'?ref='+encodeURIComponent(saved.commit.sha));
            if(Buffer.from(checked.content.replace(/\s/g,''),'base64').toString('utf8')!==serialized)throw new Error('Private receipt did not match.');
            await check();
            return {verified:true,receiptPath,receiptCommit:saved.commit.sha};
          }

          try {
            const result=await cloudPrivateBackup(process.env);
            const {appendFile}=await import('node:fs/promises');
            await appendFile(process.env.GITHUB_STEP_SUMMARY,'Private backup integrity and no-write restore check passed.\n\nReceipt (private repository only): '+result.receiptPath+'\n\nNo live state was replaced; no deployment or activation setting was changed.\n');
            console.log('Private backup and no-write restore check passed. Receipt saved in the private data repository.');
          } catch {
            console.error('Backup was NOT verified. Do not activate or deploy. Review repository permissions and writer coordination privately. No response bodies are logged.');
            process.exitCode=1;
          }
          PRIVATE_BACKUP_SCRIPT
